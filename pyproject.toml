[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extractor"
version = "0.1.0"
description = "DaRe — Data Restructurer: deterministic structured-data extraction agent (HTML via Playwright, PDFs, Excel restructuring) with strict Pydantic schemas and schema-validation feedback loops."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Buffy" }]
dependencies = [
    "instructor[litellm]>=1.8.0",
    "litellm>=1.40.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "playwright>=1.44",
    "pymupdf>=1.24",
    "typer>=0.12",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "structlog>=24.1",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
outlines = ["outlines>=0.1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
    "httpx>=0.27",
    "pillow>=10.0",
    "types-pillow",
]

[project.scripts]
extractor = "extractor.cli:app"

[tool.vercel]
# Explicit entrypoint so Vercel does not guess among the multiple `app`
# variables in this repo (CLI, API package, tests). Points at the FastAPI app
# exposed by the root main.py shim (which also makes src/ importable).
entrypoint = "main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI/typer require call-in-default idioms

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["extractor"]
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
